services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: datainsight
      POSTGRES_PASSWORD: datainsight
      POSTGRES_DB: datainsight
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

volumes:
  pgdata:
  qdrantdata: